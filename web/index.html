<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurora · Revenue workspace</title>
    <script>
      // Apply the saved theme before the first paint, so a dark-mode user never sees a
      // light flash. ThemeProvider.tsx takes over once React has loaded.
      (function applySavedThemeBeforePaint() {
        try {
          var savedPreference = localStorage.getItem('aurora.theme-preference');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolvedTheme =
            savedPreference === 'dark' || (savedPreference === 'system' && prefersDark) ? 'dark' : 'light';
          document.documentElement.dataset.theme = resolvedTheme;
        } catch (error) {
          // Storage blocked: keep the default light theme.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
